name: E1 checks
on:
  push:
  pull_request:
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Check no private Supabase credentials are committed
        run: |
          ! grep -R -E 'sb_secret_|service_role' --include='*.js' --include='*.html' .
      - name: Confirm E1 HTML entry point
        run: test -f index.html && test -f style.css && test -f app.js
